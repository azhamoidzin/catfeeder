version: '3.8'

services:
  backend:
    build:
      dockerfile: ./Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - secrets.env
    networks:
      catfeeder:
        aliases:
          - backend

  db:
    image: mysql:9.1.0
    env_file:
      - secrets.env
    ports:
      - "3306:3306"
    volumes:
      - "./db:/var/lib/mysql"
    networks:
      catfeeder:
        aliases:
          - db

networks:
  catfeeder: null